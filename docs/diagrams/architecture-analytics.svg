<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-analytics-title architecture-analytics-desc" id="architecture-analytics-root">
        <title id="architecture-analytics-title">Analytics path: backfill, dbt marts and analysis</title>
        <desc id="architecture-analytics-desc">An hourly Airflow DAG runs the backfill, which loads Coinbase REST candles and repairs trade gaps in TimescaleDB alongside the streaming pipeline's candles, then runs dbt to build tested marts that feed the market analysis notebook.</desc>
        <defs>
      <style>#architecture-analytics-root { --color-paper:  #ffffff;   
      --color-ink:    #2a313a;   
      --color-muted:  #5a6470;   
      --color-accent: #5b4bc4;   
      --font-sans:    'Onest', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace; }
      #architecture-analytics-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-analytics-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-analytics-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-analytics-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6470"/></marker>
          <marker id="architecture-analytics-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b4bc4"/></marker>
          <marker id="architecture-analytics-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b7a53"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- ============ ZONE (drawn first) ============ -->
        <rect x="396" y="224" width="356" height="104" rx="8" fill="#2a313a" stroke="#2a313a" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="404" y="228" width="52" height="12" rx="2" fill="#ffffff"/>
        <text x="430" y="237" fill="#636d79" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">WAREHOUSE</text>

        <!-- ============ ARROWS (before nodes) ============ -->
        <!-- Airflow -> Backfill (orchestration) -->
        <path d="M 412,148 H 300 Q 292,148 292,156 V 256" fill="none" stroke="#5a6470" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-analytics-arrow)"/>
        <rect x="236" y="196" width="48" height="12" rx="2" fill="#ffffff"/>
        <text x="260" y="205" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RUN FIRST</text>

        <!-- Airflow -> dbt (orchestration) -->
        <path d="M 548,148 H 660 Q 668,148 668,156 V 256" fill="none" stroke="#5a6470" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-analytics-arrow)"/>
        <rect x="676" y="196" width="72" height="12" rx="2" fill="#ffffff"/>
        <text x="712" y="205" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">THEN DBT BUILD</text>

        <!-- Coinbase REST -> Backfill -->
        <line x1="172" y1="284" x2="224" y2="284" stroke="#5a6470" stroke-width="1.2" marker-end="url(#architecture-analytics-arrow)"/>

        <!-- Backfill -> TimescaleDB -->
        <line x1="360" y1="284" x2="412" y2="284" stroke="#5a6470" stroke-width="1.2" marker-end="url(#architecture-analytics-arrow)"/>
        <rect x="368" y="264" width="36" height="12" rx="2" fill="#ffffff"/>
        <text x="386" y="273" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>

        <!-- TimescaleDB -> dbt -->
        <line x1="548" y1="284" x2="600" y2="284" stroke="#5a6470" stroke-width="1.2" marker-end="url(#architecture-analytics-arrow)"/>
        <rect x="554" y="264" width="40" height="12" rx="2" fill="#ffffff"/>
        <text x="574" y="273" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SOURCES</text>

        <!-- dbt -> analysis -->
        <line x1="736" y1="284" x2="788" y2="284" stroke="#5a6470" stroke-width="1.2" marker-end="url(#architecture-analytics-arrow)"/>
        <rect x="746" y="264" width="32" height="12" rx="2" fill="#ffffff"/>
        <text x="762" y="273" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MARTS</text>

        <!-- Streaming pipeline -> TimescaleDB -->
        <line x1="480" y1="392" x2="480" y2="312" stroke="#5a6470" stroke-width="1.2" marker-end="url(#architecture-analytics-arrow)"/>
        <rect x="488" y="346" width="64" height="12" rx="2" fill="#ffffff"/>
        <text x="520" y="355" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LIVE CANDLES</text>

