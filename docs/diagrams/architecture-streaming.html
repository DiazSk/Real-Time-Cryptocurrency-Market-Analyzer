<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streaming Path</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      /* Skin: the frontend's Iridescent Edge tokens (frontend/app/globals.css) */
      --color-paper:  #ffffff;   /* cloud */
      --color-ink:    #2a313a;   /* dark slate */
      --color-muted:  #5a6470;   /* slate */
      --color-accent: #5b4bc4;   /* violet-ink */
      --font-sans:    'Onest', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Streaming path</p>
    <h1>From a Coinbase trade to the live terminal</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-streaming-title architecture-streaming-desc">
        <title id="architecture-streaming-title">Streaming path: Coinbase trades to the live terminal</title>
        <desc id="architecture-streaming-desc">Coinbase trades flow through a Python producer and Kafka into Apache Flink, which stores deduplicated one-minute candles in TimescaleDB and the latest candle in Redis, both served by FastAPI to the Next.js terminal, while the producer also streams raw ticks to Redis for the live line.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6470"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b4bc4"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b7a53"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- ============ ZONES (drawn first) ============ -->
        <rect x="396" y="104" width="356" height="104" rx="8" fill="rgba(42,49,58,0.02)" stroke="rgba(42,49,58,0.10)" stroke-width="0.8"/>
        <rect x="404" y="108" width="96" height="12" rx="2" fill="#ffffff"/>
        <text x="452" y="117" fill="#636d79" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STREAM PROCESSING</text>

        <rect x="584" y="240" width="356" height="104" rx="8" fill="rgba(42,49,58,0.02)" stroke="rgba(42,49,58,0.10)" stroke-width="0.8"/>
        <rect x="592" y="244" width="44" height="12" rx="2" fill="#ffffff"/>
        <text x="614" y="253" fill="#636d79" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STORAGE</text>

        <rect x="396" y="376" width="356" height="104" rx="8" fill="rgba(42,49,58,0.02)" stroke="rgba(42,49,58,0.10)" stroke-width="0.8"/>
        <rect x="404" y="380" width="44" height="12" rx="2" fill="#ffffff"/>
        <text x="426" y="389" fill="#636d79" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SERVING</text>

        <!-- ============ ARROWS (before nodes) ============ -->
        <!-- Coinbase -> Producer -->
        <line x1="172" y1="164" x2="224" y2="164" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="180" y="144" width="36" height="12" rx="2" fill="#ffffff"/>
        <text x="198" y="153" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TRADES</text>

        <!-- Producer -> Kafka -->
        <line x1="360" y1="164" x2="412" y2="164" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Kafka -> Flink -->
        <line x1="548" y1="152" x2="600" y2="152" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Flink -> Kafka (alerts topic, exactly-once) -->
        <line x1="600" y1="176" x2="548" y2="176" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="556" y="184" width="36" height="12" rx="2" fill="#ffffff"/>
        <text x="574" y="193" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ALERTS</text>

        <!-- Producer -> Redis: raw tick stream for the live line (bypasses Kafka/Flink) -->
        <path d="M 292,192 V 352 Q 292,360 300,360 H 660 a 8,8 0 0,1 16,0 H 824 Q 832,360 832,352 V 328" fill="none" stroke="#5a6470" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="300" y="264" width="60" height="12" rx="2" fill="#ffffff"/>
        <text x="330" y="273" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TICK STREAM</text>

        <!-- Flink -> TimescaleDB (headline: correct candles, stored idempotently) -->
        <line x1="668" y1="192" x2="668" y2="272" stroke="#5b4bc4" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="676" y="226" width="40" height="12" rx="2" fill="#ffffff"/>
        <text x="696" y="235" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CANDLES</text>

        <!-- Flink -> Redis -->
        <path d="M 736,164 H 848 Q 856,164 856,172 V 272" fill="none" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="864" y="212" width="36" height="12" rx="2" fill="#ffffff"/>
        <text x="882" y="221" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LATEST</text>

        <!-- TimescaleDB -> FastAPI -->
        <line x1="668" y1="328" x2="668" y2="408" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Redis -> FastAPI -->
        <path d="M 880,328 V 428 Q 880,436 872,436 H 736" fill="none" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="888" y="372" width="40" height="12" rx="2" fill="#ffffff"/>
        <text x="908" y="381" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUB/SUB</text>

        <!-- FastAPI -> Next.js terminal -->
        <line x1="600" y1="436" x2="548" y2="436" stroke="#0b7a53" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="554" y="416" width="40" height="12" rx="2" fill="#ffffff"/>
        <text x="574" y="425" fill="#636d79" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REST/WS</text>

        <!-- ============ NODES ============ -->
        <!-- Coinbase (external) -->
        <rect x="36" y="136" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="36" y="136" width="136" height="56" rx="6" fill="rgba(42,49,58,0.03)" stroke="rgba(42,49,58,0.30)" stroke-width="1"/>
        <rect x="44" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(42,49,58,0.30)" stroke-width="0.8"/>
        <text x="64" y="151" fill="#5a6470" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SOURCE</text>
        <text x="104" y="172" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">Coinbase</text>
        <text x="104" y="186" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">matches · WebSocket</text>

        <!-- Producer (backend) -->
        <rect x="224" y="136" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="224" y="136" width="136" height="56" rx="6" fill="#ffffff" stroke="#2a313a" stroke-width="1"/>
        <rect x="232" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(42,49,58,0.40)" stroke-width="0.8"/>
        <text x="252" y="151" fill="#5a6470" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PYTHON</text>
        <text x="292" y="172" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">Producer</text>
        <text x="292" y="186" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">validate · gap-track</text>

        <!-- Kafka (backend) -->
        <rect x="412" y="136" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="412" y="136" width="136" height="56" rx="6" fill="#ffffff" stroke="#2a313a" stroke-width="1"/>
        <rect x="420" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(42,49,58,0.40)" stroke-width="0.8"/>
        <text x="440" y="151" fill="#5a6470" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BROKER</text>
        <text x="480" y="172" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">Kafka</text>
        <text x="480" y="186" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">trades · alerts</text>

        <!-- Apache Flink (focal) -->
        <rect x="600" y="136" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="600" y="136" width="136" height="56" rx="6" fill="rgba(91,75,196,0.08)" stroke="#5b4bc4" stroke-width="1.2"/>
        <rect x="608" y="142" width="40" height="12" rx="2" fill="transparent" stroke="rgba(91,75,196,0.40)" stroke-width="0.8"/>
        <text x="628" y="151" fill="#5b4bc4" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STREAM</text>
        <text x="668" y="172" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">Apache Flink</text>
        <text x="668" y="186" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">OHLCV · z-score</text>

        <!-- TimescaleDB (store) -->
        <rect x="600" y="272" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="600" y="272" width="136" height="56" rx="6" fill="rgba(42,49,58,0.05)" stroke="#5a6470" stroke-width="1"/>
        <rect x="608" y="278" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,100,112,0.40)" stroke-width="0.8"/>
        <text x="626" y="287" fill="#5a6470" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="668" y="308" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">TimescaleDB</text>
        <text x="668" y="322" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">candles · alerts</text>

        <!-- Redis (store) -->
        <rect x="788" y="272" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="788" y="272" width="136" height="56" rx="6" fill="rgba(42,49,58,0.05)" stroke="#5a6470" stroke-width="1"/>
        <rect x="796" y="278" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,100,112,0.40)" stroke-width="0.8"/>
        <text x="814" y="287" fill="#5a6470" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CACHE</text>
        <text x="856" y="308" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">Redis</text>
        <text x="856" y="322" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">latest · pub/sub</text>

        <!-- FastAPI (backend) -->
        <rect x="600" y="408" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="600" y="408" width="136" height="56" rx="6" fill="#ffffff" stroke="#2a313a" stroke-width="1"/>
        <rect x="608" y="414" width="24" height="12" rx="2" fill="transparent" stroke="rgba(42,49,58,0.40)" stroke-width="0.8"/>
        <text x="620" y="423" fill="#5a6470" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="668" y="444" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">FastAPI</text>
        <text x="668" y="458" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">REST + WebSocket</text>

        <!-- Next.js terminal (client) -->
        <rect x="412" y="408" width="136" height="56" rx="6" fill="#ffffff"/>
        <rect x="412" y="408" width="136" height="56" rx="6" fill="rgba(90,100,112,0.10)" stroke="#636d79" stroke-width="1"/>
        <rect x="420" y="414" width="40" height="12" rx="2" fill="transparent" stroke="rgba(99,109,121,0.40)" stroke-width="0.8"/>
        <text x="440" y="423" fill="#5a6470" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
        <text x="480" y="444" fill="#2a313a" font-size="12" font-weight="600" font-family="'Onest', system-ui, sans-serif" text-anchor="middle">Next.js terminal</text>
        <text x="480" y="458" fill="#5a6470" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">live line · candles</text>

        <!-- ============ LEGEND (bottom strip) ============ -->
        <line x1="36" y1="512" x2="924" y2="512" stroke="rgba(42,49,58,0.10)" stroke-width="0.8"/>
        <text x="36" y="528" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="36" y="541" width="16" height="10" rx="2" fill="rgba(91,75,196,0.08)" stroke="#5b4bc4" stroke-width="1"/>
        <text x="58" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">FOCAL</text>
        <rect x="148" y="541" width="16" height="10" rx="2" fill="#ffffff" stroke="#2a313a" stroke-width="1"/>
        <text x="170" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">SERVICE</text>
        <rect x="260" y="541" width="16" height="10" rx="2" fill="rgba(42,49,58,0.05)" stroke="#5a6470" stroke-width="1"/>
        <text x="282" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">STORE</text>
        <rect x="372" y="541" width="16" height="10" rx="2" fill="rgba(42,49,58,0.03)" stroke="rgba(42,49,58,0.30)" stroke-width="1"/>
        <text x="394" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">EXTERNAL</text>
        <rect x="484" y="541" width="16" height="10" rx="2" fill="rgba(90,100,112,0.10)" stroke="#636d79" stroke-width="1"/>
        <text x="506" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">CLIENT</text>
        <line x1="596" y1="546" x2="616" y2="546" stroke="#5a6470" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="624" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">DATA</text>
        <line x1="708" y1="546" x2="728" y2="546" stroke="#0b7a53" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="736" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">API CALL</text>
        <line x1="820" y1="546" x2="840" y2="546" stroke="#5a6470" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="848" y="549" fill="#5a6470" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">LIVE TICKS</text>
      </svg>
    </div>
  </div>
</body>
</html>
