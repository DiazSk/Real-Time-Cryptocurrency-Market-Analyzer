name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-api.txt
      - run: pytest -q

  flink:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/flink_jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - run: mvn -B -q package # runs the JUnit tests, then builds the job JAR

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15 # same image as docker-compose.yml
        env:
          POSTGRES_USER: crypto_user
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crypto_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crypto_user -d crypto_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: crypto_user
      PGPASSWORD: ci
      PGDATABASE: crypto_db
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -q -f configs/init-db.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f configs/migrations/001_analytics.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f configs/migrations/001_analytics.sql # idempotent
      - run: psql -v ON_ERROR_STOP=1 -q -f tests/sql/schema_checks.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f tests/sql/chaos_checks_test.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f tests/sql/analytics_schema_checks.sql

  analytics:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: crypto_user
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: crypto_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crypto_user -d crypto_db"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: crypto_user
      PGPASSWORD: ci
      PGDATABASE: crypto_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analytics.txt
      - run: pip install -r requirements-analytics.txt
      - run: psql -v ON_ERROR_STOP=1 -q -f configs/init-db.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f configs/migrations/001_analytics.sql
      - run: psql -v ON_ERROR_STOP=1 -q -f tests/sql/analytics_fixture.sql
      - run: dbt deps && dbt build --target ci
        working-directory: analytics
        env:
          DBT_PROFILES_DIR: .

  airflow:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analytics.txt
      # Mirrors the local layout: the DAG calls venv/bin/dbt, Airflow lives in its own env.
      - run: python -m venv venv && venv/bin/pip install -r requirements-analytics.txt
      - run: pip install "apache-airflow==3.3.2" "astronomer-cosmos==1.15.1" --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: airflow db migrate
      - name: DAG imports cleanly
        run: |
          out=$(airflow dags list-import-errors 2>/dev/null)
          echo "$out"
          echo "$out" | grep -q "No data found"
      - name: DAG renders one run and one test task per dbt model
        run: airflow tasks list crypto_analytics | tee tasks.txt && grep -q "dbt.mart_signals.test" tasks.txt
