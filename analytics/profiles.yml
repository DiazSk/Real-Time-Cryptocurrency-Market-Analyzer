# Connection settings come from the environment (.env locally, job env in CI); nothing secret is committed.
crypto_analytics:
  target: dev
  outputs:
    dev: &postgres
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'crypto_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'crypto_pass') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'crypto_db') }}"
      schema: analytics
      threads: 4
    ci:
      <<: *postgres
