version: 2

sources:
  - name: pipeline
    description: Tables written by the streaming pipeline (Flink or the lite consumer) and by src/backfill.
    schema: public
    tables:
      - name: cryptocurrencies
        description: Symbol registry; one row per tracked Coinbase product.
      - name: raw_trades
        description: Every trade from the Coinbase matches feed (source=stream) plus REST-repaired gaps (source=rest_backfill).
      - name: price_aggregates_1m
        description: The pipeline's own 1-minute OHLCV + VWAP candles, computed in event time.
        config:
          loaded_at_field: window_end
          freshness:
            warn_after: {count: 10, period: minute}
            error_after: {count: 1, period: hour}
      - name: coinbase_candles_1m
        description: Official Coinbase 1-minute candles loaded by src/backfill/candles.py (90 days, then hourly).
        config:
          loaded_at_field: bucket
          freshness:
            warn_after: {count: 2, period: hour}
            error_after: {count: 1, period: day}
      - name: price_alerts
        description: Flink's z-score anomaly alerts.
